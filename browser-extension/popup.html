<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Log Analyzer Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
    }
    .title h3 { font-size: 14px; font-weight: 700; color: #fff; }
    .title p { font-size: 11px; color: #94a3b8; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    input[type="text"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #6366f1; }
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .btn-secondary:hover { background: #475569; }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 10px;
    }
    .status-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .status-label { color: #94a3b8; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-idle { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
    .notice { font-size: 10px; color: #64748b; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div class="title">
      <h3>Smart Log Analyzer</h3>
      <p>Tab Telemetry Monitor</p>
    </div>
  </div>

  <div class="form-group">
    <label for="target-url">Target Tab / Website URL</label>
    <input type="text" id="target-url" placeholder="https://example.com or current tab">
  </div>

  <button id="btn-use-active" class="btn btn-secondary">
    🎯 Select Active Tab
  </button>

  <div class="form-group">
    <label for="backend-url">Analyzer Backend API</label>
    <input type="text" id="backend-url" value="http://localhost:3000/api/monitor/events">
  </div>

  <button id="btn-toggle-monitor" class="btn btn-primary">
    ▶ Start Monitoring
  </button>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Status:</span>
      <span id="status-badge" class="badge badge-idle">IDLE</span>
    </div>
    <div class="status-row">
      <span class="status-label">Monitored Tab:</span>
      <span id="status-tab" style="font-family: monospace; font-size: 11px;">None</span>
    </div>
    <div class="status-row">
      <span class="status-label">Events Sent:</span>
      <span id="status-events" style="font-weight: bold; color: #38bdf8;">0</span>
    </div>
    <div class="status-row">
      <span class="status-label">Errors Detected:</span>
      <span id="status-errors" style="font-weight: bold; color: #f87171;">0</span>
    </div>
  </div>

  <p class="notice">
    🔒 Privacy notice: Collects safe network metadata & console errors only. No passwords, tokens, or private form payloads are captured.
  </p>

  <script src="popup.js"></script>
</body>
</html>
